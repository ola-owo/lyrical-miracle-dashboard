[project]
name = "dashboard"
version = "0.3.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3",
    "faiss-cpu>=1.13.2",
    "google-cloud-bigquery>=3.44.0",
    "google-cloud-bigquery-storage>=2.41.0",
    "google-genai>=2.6.0",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pendulum>=3.2.0",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "requests>=2.34.2",
    "streamlit-agraph>=0.0.45",
    "streamlit[charts]>=1.57.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dashboard"
module-root = ""

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
precompute = [
    "marimo>=0.23.11",
]
